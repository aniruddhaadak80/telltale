name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # The build must not require a network feed or a database. The embedded
          # store is allowed here because this is an explicit CI verification, and
          # `resolveAdapter` still refuses it in a real production start.
          TELLTALE_ALLOW_EMBEDDED_STORE: "1"

  browser:
    name: browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          TELLTALE_ALLOW_EMBEDDED_STORE: "1"

      - name: Browser journey on desktop and mobile
        run: npm run test:e2e
        env:
          TELLTALE_ALLOW_EMBEDDED_STORE: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  benchmark-parity:
    name: benchmark scorer parity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: The benchmark scripts match the application source
        run: |
          npm run bench:prepare
          if ! git diff --quiet -- benchmark/telltale-hold; then
            echo "benchmark/telltale-hold is stale. Run 'npm run bench:prepare' and commit the result." >&2
            git --no-pager diff -- benchmark/telltale-hold
            exit 1
          fi

      - name: The Python grader agrees with the TypeScript engine
        run: npm run bench:parity